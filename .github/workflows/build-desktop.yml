name: Build Windows Desktop Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install backend dependencies
        run: python -m pip install -r backend\requirements.txt pyinstaller

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm.cmd ci

      - name: Build local desktop package
        run: powershell -ExecutionPolicy Bypass -File scripts\publish-desktop.ps1

      - name: Archive package
        run: Compress-Archive -Path dist\MarketingAnalytics\* -DestinationPath dist\MarketingAnalytics-win-x64.zip

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: MarketingAnalytics-win-x64
          path: dist\MarketingAnalytics-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          gh release create "$env:RELEASE_TAG"
          "dist\MarketingAnalytics-win-x64.zip#Marketing Analytics for Windows x64"
          --title "Marketing Analytics $env:RELEASE_TAG"
          --generate-notes

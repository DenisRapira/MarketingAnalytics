name: Build Windows Desktop Package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install backend dependencies
        run: python -m pip install -r backend\requirements.txt pyinstaller

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm.cmd ci

      - name: Validate backend modules
        run: >
          python -m py_compile
          backend\main.py
          backend\analytics.py
          backend\column_mapper.py
          backend\data_processor.py
          backend\insights.py
          backend\marketing_intelligence.py
          backend\pdf_report.py
          backend\visualizer.py

      - name: Build frontend
        working-directory: frontend
        run: npm.cmd run build

      - name: Build desktop host
        run: dotnet build desktop-webview2\SocialMetrics.Desktop.csproj -c Release

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install backend dependencies
        run: python -m pip install -r backend\requirements.txt pyinstaller

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm.cmd ci

      - name: Build local desktop package
        run: powershell -ExecutionPolicy Bypass -File scripts\publish-desktop.ps1

      - name: Archive package
        run: |
          Compress-Archive -Path dist\MarketingAnalytics\* -DestinationPath dist\MarketingAnalytics-win-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist\MarketingAnalytics-win-x64.zip).Hash.ToLower()
          "$hash  MarketingAnalytics-win-x64.zip" | Set-Content -Encoding ASCII dist\SHA256SUMS.txt

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: MarketingAnalytics-win-x64
          path: |
            dist\MarketingAnalytics-win-x64.zip
            dist\SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          gh release create "$env:RELEASE_TAG"
          "dist\MarketingAnalytics-win-x64.zip#Marketing Analytics for Windows x64"
          "dist\SHA256SUMS.txt#SHA-256 checksums"
          --title "Marketing Analytics $env:RELEASE_TAG"
          --generate-notes

name: Ошибка
description: Сообщить о воспроизводимой проблеме приложения
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Не прикладывайте клиентские выгрузки, PDF, токены и персональные данные."
  - type: input
    id: version
    attributes:
      label: Версия приложения
      placeholder: "Например, 1.0.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Импорт данных
        - Аналитика
        - Диаграммы
        - PDF-отчёт
        - Desktop-приложение
        - Установка или обновление
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows и архитектура
      placeholder: "Windows 11 23H2, x64"
